[workspace]
resolver = "3"

[package]
name = "vox-client"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
lab = []
desktop = ["dep:gpui-kit", "dep:async-channel", "dep:image", "dep:raw-window-handle", "dep:windows", "dep:windows-core"]
webrtc = ["dep:libwebrtc"]

[dependencies]
vox-protocol = { git = "https://github.com/Slowfixxit1337/vox-protocol.git", rev = "81e12501ffe9e339f306dde2d189ff10a317ad1e" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.0"
hex = "0.4"
sha2 = "0.10"
rand = "0.10"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"

[dev-dependencies]
tempfile = "3"
data-encoding = "2"
hmac = "0.12"
sha1 = "0.10"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_WinRT_Graphics_Capture", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.dependencies]
async-channel = { version = "2.5", optional = true }
gpui-kit = { version = "=0.11.0", default-features = false, features = ["component"], optional = true }
image = { version = "0.25", default-features = false, optional = true }
libwebrtc = { version = "=0.4.2", optional = true }
raw-window-handle = { version = "0.6", optional = true }
windows-core = { version = "=0.62.2", optional = true }
windows = { version = "=0.62.2", optional = true, features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT_Direct3D11",
    "Win32_UI_Shell",
] }

[[bin]]
name = "vox-lab"
required-features = ["lab"]
