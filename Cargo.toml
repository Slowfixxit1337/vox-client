[workspace]
resolver = "3"

[package]
name = "vox-client"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
lab = []
desktop = ["dep:gpui-kit"]
webrtc = ["dep:libwebrtc"]

[dependencies]
vox-protocol = { git = "https://github.com/Slowfixxit1337/vox-protocol.git", rev = "bc772462604b3d84ee71f1fe43b2834b841958dc" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.0"
hex = "0.4"
sha2 = "0.10"
rand = "0.10"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "net", "time"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }

[target.'cfg(windows)'.dependencies]
gpui-kit = { version = "=0.11.0", default-features = false, features = ["component"], optional = true }
libwebrtc = { version = "=0.4.2", optional = true }

[[bin]]
name = "vox-lab"
required-features = ["lab"]
